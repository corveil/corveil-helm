{{- include "corveil.migrationGuards" . -}}
{{- $origins := .Values.corveil.sessionAuthAllowedOrigins }}
{{- if and (not $origins) .Values.corveil.uiBaseUrl }}
{{- $origins = list (trimSuffix "/" .Values.corveil.uiBaseUrl) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "corveil.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.corveil.environment | quote }}
  LOG_LEVEL: {{ .Values.corveil.logLevel | quote }}
  API_KEY_PREFIX: {{ .Values.corveil.apiKeyPrefix | quote }}
  AUTO_PROVISION_USERS: {{ .Values.corveil.autoProvisionUsers | quote }}
  {{- if .Values.corveil.devAuth }}
  DEV_AUTH: "true"
  {{- end }}
  GUARDRAILS_ENABLED: {{ .Values.corveil.guardrails.enabled | quote }}
  GUARDRAIL_PII_FILTER: {{ .Values.corveil.guardrails.piiFilter | quote }}
  PASSTHROUGH_ENABLED: {{ .Values.corveil.passthrough.enabled | quote }}
  PLUGINS_ENABLED: {{ .Values.corveil.plugins.enabled | quote }}
  DEFAULT_RATE_LIMIT_RPM: {{ .Values.rateLimiting.defaultRpm | quote }}
  DEFAULT_RATE_LIMIT_TPM: {{ .Values.rateLimiting.defaultTpm | quote }}
  {{- /* UI and sessions */}}
  UI_SESSION_EXPIRY_HOURS: {{ .Values.corveil.uiSessionExpiryHours | quote }}
  {{- if .Values.corveil.uiBaseUrl }}
  UI_BASE_URL: {{ .Values.corveil.uiBaseUrl | quote }}
  {{- end }}
  {{- if $origins }}
  SESSION_AUTH_ALLOWED_ORIGINS: {{ join "," $origins | quote }}
  {{- end }}
  {{- with .Values.corveil.trustedProxyIps }}
  TRUSTED_PROXY_IPS: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.corveil.providerCredentialsKmsKeyArn }}
  CORVEIL_PROVIDER_CREDS_KMS_KEY_ARN: {{ . | quote }}
  {{- end }}
  {{- /* Offline license */}}
  {{- if .Values.license.enabled }}
  CORVEIL_LICENSE_OFFLINE_ENABLED: "true"
  CORVEIL_LICENSE_ORG: {{ .Values.license.org | quote }}
  CORVEIL_LICENSE_ORG_ID: {{ .Values.license.orgId | quote }}
  CORVEIL_LICENSE_KEY_FILE: {{ printf "%s/%s" .Values.license.mountPath .Values.license.keySecretKey | quote }}
  CORVEIL_LICENSE_PUBLIC_KEY_FILE: {{ printf "%s/%s" .Values.license.mountPath .Values.license.publicKeySecretKey | quote }}
  CORVEIL_LICENSE_REVALIDATE_INTERVAL: {{ .Values.license.revalidateInterval | quote }}
  {{- end }}
  {{- /* Filesystem sensor root: read by the workers poll and the api's Test connection */}}
  {{- if .Values.knowledge.sensors.filesystem.enabled }}
  FILESYSTEM_SENSOR_ROOT: {{ .Values.knowledge.sensors.filesystem.mountPath | quote }}
  {{- end }}
  CORVEIL_SENSOR_ALLOW_PRIVATE_NETWORKS: {{ .Values.knowledge.sensors.allowPrivateNetworks | quote }}
  CORVEIL_SENSOR_AMBIENT_CREDENTIALS: {{ .Values.knowledge.sensors.ambientCredentials | quote }}
  {{- /* MCP runner */}}
  {{- if .Values.mcpRunner.allowedHosts }}
  MCP_RUNNER_ALLOWED_HOSTS: {{ .Values.mcpRunner.allowedHosts | quote }}
  {{- end }}
  {{- /* Provider config */}}
  {{- if .Values.providers.openrouter.siteUrl }}
  OPENROUTER_SITE_URL: {{ .Values.providers.openrouter.siteUrl | quote }}
  {{- end }}
  {{- if .Values.providers.openrouter.appName }}
  OPENROUTER_APP_NAME: {{ .Values.providers.openrouter.appName | quote }}
  {{- end }}
  {{- if .Values.providers.vertexai.projectId }}
  GCP_PROJECT_ID: {{ .Values.providers.vertexai.projectId | quote }}
  GCP_LOCATION: {{ .Values.providers.vertexai.location | quote }}
  {{- end }}
  {{- if .Values.providers.bedrock.enabled }}
  AWS_REGION: {{ .Values.providers.bedrock.region | quote }}
  AWS_USE_TASK_ROLE: {{ .Values.providers.bedrock.useTaskRole | quote }}
  {{- end }}
