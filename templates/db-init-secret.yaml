{{- if .Values.postgresql.enabled }}
{{- /*
First-boot init script for the bundled PostgreSQL. The Bitnami image sources it once, on an
empty data volume. It is a shell script rather than .sql because Bitnami runs .sql init files
as auth.username (not a superuser) and discards their errors; this runs the SQL as the
postgres superuser and fails the container loudly if any statement fails. It gives the bundled database the same
three-role layout production uses (docs/CONFIGURATION.md, Database roles):

  postgresql.auth.username  owns the schema; the api migrates as it (DATABASE_URL_PRIVILEGED)
  corveil_app      runtime role, NOBYPASSRLS (DATABASE_URL)
  corveil_system   cross-org system role, BYPASSRLS (DATABASE_URL_SYSTEM)

Table grants for corveil_app come from Corveil's own migrations. It also creates pgvector,
which only a superuser can do.
*/}}
{{- $db := .Values.postgresql.auth.database }}
{{- $owner := .Values.postgresql.auth.username }}
{{- $pw := .Values.postgresql.auth.password | default "" | replace "'" "''" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    {{- include "corveil.labels" . | nindent 4 }}
type: Opaque
stringData:
  10-corveil-roles.sh: |
    #!/bin/bash
    # Sourced by the Bitnami init loop: no `set -e`, report and exit on failure.
    PGPASSWORD="${POSTGRESQL_POSTGRES_PASSWORD:-$(cat "${POSTGRESQL_POSTGRES_PASSWORD_FILE:-$POSTGRES_POSTGRES_PASSWORD_FILE}")}" \
      psql -v ON_ERROR_STOP=1 -U postgres -d "$POSTGRESQL_DATABASE" <<'SQL' || { echo "corveil: creating the Corveil database roles failed" >&2; exit 1; }
      CREATE EXTENSION IF NOT EXISTS vector;
      CREATE EXTENSION IF NOT EXISTS pgcrypto;

      CREATE ROLE corveil_app LOGIN PASSWORD '{{ $pw }}' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
      CREATE ROLE corveil_system LOGIN PASSWORD '{{ $pw }}' NOSUPERUSER BYPASSRLS NOCREATEDB NOCREATEROLE;

      GRANT CONNECT ON DATABASE "{{ $db }}" TO corveil_app, corveil_system;
      GRANT USAGE ON SCHEMA public TO corveil_app, corveil_system;

      -- corveil_app: table grants are migration-owned; sequences and functions are blanket.
      ALTER DEFAULT PRIVILEGES FOR ROLE "{{ $owner }}" IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO corveil_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE "{{ $owner }}" IN SCHEMA public
        GRANT EXECUTE ON FUNCTIONS TO corveil_app;

      -- corveil_system: full DML on every table the owner creates.
      ALTER DEFAULT PRIVILEGES FOR ROLE "{{ $owner }}" IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO corveil_system;
      ALTER DEFAULT PRIVILEGES FOR ROLE "{{ $owner }}" IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO corveil_system;
    SQL
    echo "corveil: created pgvector and the corveil_app / corveil_system roles"
{{- end }}
