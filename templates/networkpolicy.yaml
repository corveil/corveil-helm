{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "corveil.fullname" . }}
  labels:
    {{- include "corveil.labels" . | nindent 4 }}
spec:
  # Every Corveil pod in this release: api, workers and system jobs.
  podSelector:
    matchLabels:
      {{- include "corveil.partOfLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # api HTTP port and the workers health port (kubelet probes)
    - ports:
        - port: 8000
          protocol: TCP
        - port: {{ .Values.workers.healthPort }}
          protocol: TCP
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # Allow HTTPS to external LLM APIs
    - ports:
        - port: 443
          protocol: TCP
    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
