{{- if .Values.workers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "corveil.workers.fullname" . }}
  labels:
    {{- include "corveil.labels" . | nindent 4 }}
    app.kubernetes.io/component: workers
    app.kubernetes.io/part-of: corveil
spec:
  replicas: {{ .Values.workers.replicaCount }}
  # Recreate, so an upgrade never runs two workers generations side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "corveil.workers.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/env.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workers.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "corveil.workers.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: workers
        app.kubernetes.io/part-of: corveil
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "corveil.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with (include "corveil.volumes" . | trim) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "corveil.waitForDb" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: workers
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "corveil.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["/app/corveil", "workers"]
          env:
            # Worker-only switches (the api tier runs no workers).
            - name: WORKERS_HEALTH_PORT
              value: {{ .Values.workers.healthPort | quote }}
            - name: ONTOLOGY_ENABLED
              value: {{ .Values.knowledge.ontology.enabled | quote }}
            - name: ONTOLOGY_SENSOR_BRIDGE
              value: {{ .Values.knowledge.ontology.sensorBridge | quote }}
            - name: ONTOLOGY_SYNTHESIS_ENABLED
              value: {{ .Values.knowledge.ontology.synthesis | quote }}
            - name: SENSORS_ENABLED
              value: {{ .Values.knowledge.sensors.enabled | quote }}
            - name: SESSIONS_ENABLED
              value: {{ .Values.knowledge.sessions.enabled | quote }}
            {{- with (concat .Values.extraEnv .Values.workers.extraEnv) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- include "corveil.envFrom" . | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.workers.healthPort }}
              protocol: TCP
          # Workers exit while the schema is behind this build, so on an upgrade
          # they restart until the api has finished migrating.
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.workers.resources | nindent 12 }}
          {{- with (include "corveil.volumeMounts" . | trim) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
