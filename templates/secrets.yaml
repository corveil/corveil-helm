{{- include "corveil.migrationGuards" . -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "corveil.secretName" . }}
  labels:
    {{- include "corveil.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  {{- /* The three roles created by templates/db-init-secret.yaml */}}
  {{- $pg := .Values.postgresql.auth }}
  {{- $hostdb := printf "%s-postgresql:5432/%s" .Release.Name $pg.database }}
  {{- $pw := $pg.password | default "" }}
  DATABASE_URL: {{ printf "postgresql://corveil_app:%s@%s" $pw $hostdb | quote }}
  DATABASE_URL_SYSTEM: {{ printf "postgresql://corveil_system:%s@%s" $pw $hostdb | quote }}
  DATABASE_URL_PRIVILEGED: {{ printf "postgresql://%s:%s@%s" $pg.username $pw $hostdb | quote }}
  {{- else }}
  {{- if .Values.externalDatabase.url }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
  {{- if .Values.externalDatabase.systemUrl }}
  DATABASE_URL_SYSTEM: {{ .Values.externalDatabase.systemUrl | quote }}
  {{- end }}
  {{- if .Values.externalDatabase.privilegedUrl }}
  DATABASE_URL_PRIVILEGED: {{ .Values.externalDatabase.privilegedUrl | quote }}
  {{- end }}
  {{- end }}
  SECRET_KEY: {{ required "corveil.secretKey is required when existingSecret is unset — set corveil.secretKey (e.g. `openssl rand -hex 32`) or provide existingSecret." .Values.corveil.secretKey | quote }}
  {{- if .Values.corveil.uiSessionSecret }}
  UI_SESSION_SECRET: {{ .Values.corveil.uiSessionSecret | quote }}
  {{- end }}
  {{- if .Values.mcpRunner.internalSecret }}
  MCP_RUNNER_INTERNAL_SECRET: {{ .Values.mcpRunner.internalSecret | quote }}
  {{- end }}
  {{- if .Values.providers.openrouter.apiKey }}
  OPENROUTER_API_KEY: {{ .Values.providers.openrouter.apiKey | quote }}
  {{- end }}
  {{- if .Values.providers.anthropic.apiKey }}
  ANTHROPIC_API_KEY: {{ .Values.providers.anthropic.apiKey | quote }}
  {{- end }}
  {{- if .Values.providers.vertexai.credentialsJson }}
  GOOGLE_APPLICATION_CREDENTIALS_JSON: {{ .Values.providers.vertexai.credentialsJson | quote }}
  {{- end }}
  {{- if .Values.providers.bedrock.accessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.providers.bedrock.accessKeyId | quote }}
  {{- end }}
  {{- if .Values.providers.bedrock.secretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.providers.bedrock.secretAccessKey | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.license.enabled (not .Values.license.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "corveil.licenseSecretName" . }}
  labels:
    {{- include "corveil.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.license.keySecretKey }}: {{ .Values.license.key | trim | quote }}
  {{ .Values.license.publicKeySecretKey }}: {{ .Values.license.publicKey | quote }}
{{- end }}
