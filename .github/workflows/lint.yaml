name: Lint Chart

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Chart defaults (evaluation), plus the two documented install shapes.
        values:
          - name: defaults
            args: ""
          - name: evaluation
            args: "-f examples/values-evaluation.yaml"
          - name: production
            args: "-f examples/values-production.yaml"
    name: lint (${{ matrix.values.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build dependencies
        run: helm dependency build .

      - name: Helm lint
        run: helm lint . --set corveil.secretKey=test ${{ matrix.values.args }}

      # helm lint does not fail on a template `fail`; helm template does.
      - name: Helm template
        run: helm template corveil . --set corveil.secretKey=test ${{ matrix.values.args }} > /dev/null

      - name: Render templates for kubelinter
        run: helm template corveil . --set corveil.secretKey=test ${{ matrix.values.args }} --output-dir rendered

      - name: Install kubelinter
        run: |
          curl -sSLO "https://github.com/stackrox/kube-linter/releases/latest/download/kube-linter-linux"
          chmod +x kube-linter-linux
          sudo mv kube-linter-linux /usr/local/bin/kube-linter

      - name: Run kubelinter
        run: kube-linter lint rendered/corveil-chart/templates/

  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build dependencies
        run: helm dependency build .

      # Each of these must FAIL to render; a pass means a guard regressed.
      - name: Template-time guards reject invalid combinations
        run: |
          set -u
          expect_fail() {
            if helm template corveil . --set corveil.secretKey=test "$@" > /dev/null 2>&1; then
              echo "::error::expected helm template to fail: $*"; exit 1
            fi
            echo "ok (rejected): $*"
          }
          expect_fail --set corveil.environment=production --set corveil.devAuth=true --set corveil.uiSessionSecret=x
          expect_fail --set corveil.environment=production
          expect_fail --set corveil.environment=production --set corveil.uiSessionSecret=x --set postgresql.enabled=false --set externalDatabase.url=postgresql://a@b/c
          expect_fail --set postgresql.enabled=false
          expect_fail --set license.enabled=true
          expect_fail --set replicaCount=2
          expect_fail --set corveil.devLoginEnabled=true
          expect_fail --set redis.enabled=true
          expect_fail --set corveil.okta.enabled=true
