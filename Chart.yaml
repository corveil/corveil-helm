apiVersion: v2
name: corveil-chart
description: Helm chart for Corveil (API, workers and scheduled system jobs). Big Bang ready.
type: application

# Chart version — increment on each release
version: 2.0.0

# Application version deployed by this chart
appVersion: "0.5.20"

dependencies:
  - name: postgresql
    version: "18.5.2"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
